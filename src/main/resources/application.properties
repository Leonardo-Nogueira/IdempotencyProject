spring.application.name=idempotency-lab
server.port=8080

# Modo Hibrido Padrao: H2 em modo de compatibilidade PostgreSQL (roda sem precisar subir containers)
# Para usar o PostgreSQL real do docker-compose.yml, rode com: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:idempotencylab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
